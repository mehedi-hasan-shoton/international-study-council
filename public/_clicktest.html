<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:12px monospace;background:#fff;color:#000}pre{padding:8px;white-space:pre-wrap}</style></head><body>
<iframe id="f" src="/" style="border:1px solid red"></iframe>
<pre id="out">…</pre>
<script>
const W = new URLSearchParams(location.search).get('w') || '1366';
document.getElementById('f').style.width = W + 'px';
window.addEventListener('load', () => {
  const f = document.getElementById('f');
  const w = f.contentWindow, d = f.contentDocument;
  const lines = [];
  // hero inline search: type + submit
  const form = d.querySelector('.search-inline');
  const input = form && form.querySelector('input');
  lines.push(`hero form: ${!!form} input: ${!!input}`);
  if (input) {
    const setter = Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, 'value').set;
    setter.call(input, 'visa');
    input.dispatchEvent(new w.Event('input', { bubbles: true }));
    const ev = new w.Event('submit', { bubbles: true, cancelable: true });
    form.dispatchEvent(ev);
  }
  setTimeout(() => {
    lines.push(`hero inline panel (.sp--inline): ${!!d.querySelector('.sp--inline')}`);
    // also scroll to make sure the scrolly client component is alive: check its state marker
    lines.push(`scrolly stage present: ${!!d.querySelector('.scrolly__stage')}`);
    document.getElementById('out').textContent = lines.join('\n');
  }, 1500);
});
</script></body></html>
